<!doctype html>
<html lang="en" data-default-theme="{{DEFAULT_THEME}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <!--META-->
    <meta name="theme-color" content="#080b16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style id="theme-vars">/*THEME_VARS*/</style>
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="progress" aria-hidden="true"></div>
    <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

    <header class="nav" id="nav"></header>
    <main id="main"></main>
    <footer class="footer" id="footer"></footer>

    <button class="to-top" id="to-top" type="button" aria-label="Back to top" hidden></button>

    <noscript><p style="text-align:center;padding:2rem">Please enable JavaScript to view this portfolio.</p></noscript>

    <!--DATA-->
    <script src="/js/icons.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
